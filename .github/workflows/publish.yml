name: publish
# Publish to npm with provenance: push a tag v<version> matching package.json, or run it by hand
# (Actions, publish, Run workflow), which publishes the version in package.json if it is not on npm yet.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: tag matches package.json
        if: github.event_name == 'push'
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: version not already on npm
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "@arterrible/sketch@$v" version >/dev/null 2>&1; then echo "$v is already published"; exit 1; fi
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
